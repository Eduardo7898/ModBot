[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modbot"
version = "0.1.0"
description = "A Discord bot powered by Tortoise-ORM and aiosqlite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3.0",
    "tortoise-orm>=0.21,<1.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "typer>=0.12.0",
]

[project.scripts]
modbot = "modbot.main:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
